<svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
  <!-- CU Boulder Gold and Black Theme -->
  <defs>
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#CFB87C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A89968;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cloud Icon -->
  <g transform="translate(10, 15)">
    <!-- Main cloud body -->
    <path d="M 25 20 Q 25 12 32 12 Q 37 12 40 16 Q 45 12 52 15 Q 58 18 58 25 Q 58 30 54 33 L 20 33 Q 15 30 15 25 Q 15 20 20 20 Z" 
          fill="url(#cloudGradient)" stroke="#1A1A1A" stroke-width="1.5"/>
    
    <!-- Rain drops / data streams -->
    <line x1="25" y1="36" x2="25" y2="42" stroke="#4A90E2" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="35" y1="36" x2="35" y2="45" stroke="#4A90E2" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="45" y1="36" x2="45" y2="42" stroke="#4A90E2" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    
    <!-- Sun rays peeking through (subtle) -->
    <line x1="8" y1="15" x2="4" y2="11" stroke="#CFB87C" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <line x1="8" y1="25" x2="2" y2="25" stroke="#CFB87C" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>
  
  <!-- App Name -->
  <text x="75" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1A1A1A">
    Skywatch
  </text>
  <text x="75" y="52" font-family="Arial, sans-serif" font-size="11" fill="#666">
    CU Boulder ATOC
  </text>
</svg>
